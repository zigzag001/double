name: Send Push Notification

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:  # 允许手动触发

jobs:
  send-notification:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Send email notification
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT || '465' }}
          EMAIL_USE_SSL: ${{ secrets.EMAIL_USE_SSL || '1' }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SENDER_NAME: ${{ secrets.SENDER_NAME || '双色球AI预测' }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_DRY_RUN: '0'
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python send_push_notification.py

      - name: Summary
        run: |
          echo "## ✅ 推送通知已发送" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 提交者 | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 提交信息 | ${{ github.event.head_commit.message }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 分支 | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 仓库 | ${{ github.repository }} |" >> $GITHUB_STEP_SUMMARY
